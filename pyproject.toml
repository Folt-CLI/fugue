[project]
name = "fugue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
fugue = "fugue.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/fugue"]
